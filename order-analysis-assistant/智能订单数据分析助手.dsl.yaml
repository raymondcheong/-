      请上传数据源「区分客户自助下单_清洗版1.csv」（需含「客戶屬性」「创建时间」列），然后可以问：
      1）凍肉店采购各个产品的金额、箱数及占比
      2）凍肉店更偏向于几点到几点下单（基于创建时间）
