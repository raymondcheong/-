app:
  description: 支持销售/品类多维下钻、客户健康度流失预警，以及按客户属性分析产品销售占比与下单时段偏好的智能订单数据分析助手
  icon: 📊
  icon_background: '#EFF8FF'
  mode: advanced-chat
  name: 智能订单数据分析助手
  use_icon_as_answer_icon: false
kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      image:
        enabled: false
        number_limits: 3
        detail: high
        transfer_methods:
        - local_file
        - remote_url
      audio:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
        audio_languages: []
      video:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      document:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
    opening_statement: ''
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
      language: zh-Hans
      voice: ''
    return_retrieval_meta:
      enabled: false
    more_like_this:
      enabled: false
    user_input_form: []
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: start_node-source-intent_parser-target
      source: start_node
      sourceHandle: source
      target: intent_parser
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: code
      id: intent_parser-source-data_processor-target
      source: intent_parser
      sourceHandle: source
      target: data_processor
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: llm
      id: data_processor-source-answer_formatter-target
      source: data_processor
      sourceHandle: source
      target: answer_formatter
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: answer
      id: answer_formatter-source-answer-target
      source: answer_formatter
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - id: start_node
      data:
        desc: ''
        title: 开始
        type: start
        variables: []
      position:
        x: 80
        y: 280
      type: custom
    - id: intent_parser
      data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            temperature: 0.7
            max_tokens: 2000
          mode: chat
          name: qwen3.5-flash
          provider: qwen
        prompt_template:
        - id: sp1
          role: system
          text: |-
            你是一个参数提取器。请根据用户输入判断查询意图并提取参数。

            意图定义：
            - SALES_SUMMARY: 查询某销售负责的客户近一个月汇总（金额/次数）
            - SALES_CLIENT_DETAIL: 查询某销售下某个具体客户的品类订单明细及汇总
            - CATEGORY_CLIENTS: 查询购买过某品类的客户列表
            - CATEGORY_CLIENT_DETAIL: 查询某客户购买某品类的次数/数量/金额
            - CUSTOMER_HEALTH: 查询客户健康度/流失风险/活跃度/客单价变化/复购异常
              触发词示例: "哪些客户有风险" "XX客户最近怎么样" "有没有要流失的客户" "客户健康度" "预警"
            - ATTR_PRODUCT_SALES: 按客户属性维度，分析该属性客户采购各产品（小类）的金额、箱数（销售数量）及占比
              触发词示例: "凍肉店采购各产品的金额和箱数" "批發-飛機各品类销售占比" "按客户属性看产品销售" "冻肉店买了哪些产品各占多少"
            - ATTR_ORDER_TIME: 按客户属性维度，分析该属性客户更偏向在哪个时间段下单（基于创建时间）
              触发词示例: "凍肉店更偏向几点下单" "各客户属性的下单时段" "批發-加工喜欢什么时候下单" "按客户属性看下单时间分布"

            请严格以JSON格式输出，不要包含任何其他文字、不要markdown代码块：
            {
              "intent": "SALES_SUMMARY|SALES_CLIENT_DETAIL|CATEGORY_CLIENTS|CATEGORY_CLIENT_DETAIL|CUSTOMER_HEALTH|ATTR_PRODUCT_SALES|ATTR_ORDER_TIME",
              "sales_name": "销售业务员姓名(如有)",
              "client_name": "客户简称(如有)",
              "category": "小类名称(如有)",
              "customer_attr": "客户属性(如有，例如凍肉店/批發-飛機/批發-加工/燒臘/肉檯)"
            }
        - id: up1
          role: user
          text: '{{#sys.query#}}'
        title: 意图识别与参数提取
        type: llm
        vision:
          enabled: false
      position:
        x: 380
        y: 280
      type: custom
