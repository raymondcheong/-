          def parse_time(s):
              if not s or isinstance(s, (int, float)):
                  return None
              if not isinstance(s, str):
                  return None
              for fmt in ("%Y-%m-%d %H:%M:%S", "%Y-%m-%d"):
                  try:
                      return datetime.strptime(str(s), fmt)
                  except (ValueError, TypeError):
                      continue
              return None


          def _safe_num(v, default=0.0):
              try:
                  if v is None:
                      return default
                  return float(v)
              except (TypeError, ValueError):
                  return default


          def _match_attr(row_attr, target):
              if not target:
                  return True
              if row_attr is None:
                  return False
              a = str(row_attr).strip()
              b = str(target).strip()
              if a == b:
                  return True
              # 兼容简繁/别名（如用户说"冻肉店"）
              aliases = {
                  "冻肉店": "凍肉店",
                  "凍肉店": "凍肉店",
                  "批发-飞机": "批發-飛機",
                  "批發-飞机": "批發-飛機",
                  "批發-飛機": "批發-飛機",
                  "批发-加工": "批發-加工",
                  "批發-加工": "批發-加工",
                  "烧腊": "燒臘",
                  "燒臘": "燒臘",
                  "肉台": "肉檯",
                  "肉檯": "肉檯",
              }
              return aliases.get(b, b) == a or aliases.get(a, a) == aliases.get(b, b)


          def _normalize_attr_name(name):
              if not name:
                  return name
              aliases = {
                  "冻肉店": "凍肉店",
                  "批发-飞机": "批發-飛機",
                  "批發-飞机": "批發-飛機",
                  "批发-加工": "批發-加工",
                  "烧腊": "燒臘",
                  "肉台": "肉檯",
              }
              return aliases.get(str(name).strip(), str(name).strip())


          def main(parsed_intent: str) -> dict:
              params = json.loads(parsed_intent)
              intent = params.get("intent")
              sales_name = params.get("sales_name")
              client_name = params.get("client_name")
              category = params.get("category")
              customer_attr = _normalize_attr_name(params.get("customer_attr"))

              rows = json.loads(CSV_JSON)
              now = datetime.now()
              one_month_ago = now - timedelta(days=30)
              result = {"answer": ""}

              # ---------- 意图1: 销售近一个月汇总 ----------
              if intent == "SALES_SUMMARY":
                  sales_rows = [r for r in rows if r.get("销售业务员") == sales_name]
                  by_client = {}
                  for r in sales_rows:
                      by_client.setdefault(r.get("客名"), []).append(r)
                  out = []
                  for c, grp in by_client.items():
                      recent = [r for r in grp if parse_time(r["创建时间"]) and parse_time(r["创建时间"]) >= one_month_ago]
                      if not recent:
                          out.append({"client": c, "status": "近一月无订单"})
                      else:
                          out.append({
                              "client": c,
                              "amount": round(sum(_safe_num(r["訂單總金額"]) for r in recent), 2),
                              "orders": len(set(r["ERP订单号"] for r in recent)),
                          })
                  result["answer"] = json.dumps(out, ensure_ascii=False)

              # ---------- 意图2: 销售-客户品类明细 ----------
              elif intent == "SALES_CLIENT_DETAIL":
                  mask = [r for r in rows if r.get("销售业务员") == sales_name and r.get("客名") == client_name]
                  by_cat = {}
                  for r in mask:
                      by_cat.setdefault(r["小類"], []).append(r)
                  details = []
                  for cat, grp in by_cat.items():
                      details.append({
                          "category": cat,
                          "order_count": len(set(r["ERP订单号"] for r in grp)),
                          "total_qty": sum(int(_safe_num(r["数量"])) for r in grp),
                          "total_amount": round(sum(_safe_num(r["訂單總金額"]) for r in grp), 2),
                          "latest_time": max(r["创建时间"] for r in grp)[:10],
                      })
                  summary = {
                      "total_orders": len(set(r["ERP订单号"] for r in mask)),
                      "total_amount": round(sum(_safe_num(r["訂單總金額"]) for r in mask), 2),
                  }
                  result["answer"] = json.dumps({"details": details, "summary": summary}, ensure_ascii=False)

              # ---------- 意图3: 品类客户列表 ----------
              elif intent == "CATEGORY_CLIENTS":
                  cat_rows = [r for r in rows if r.get("小類") == category]
                  clients = sorted(set(r["客名"] for r in cat_rows if r.get("客名")))
                  result["answer"] = json.dumps({"clients": clients}, ensure_ascii=False)

              # ---------- 意图4: 品类-客户明细 ----------
              elif intent == "CATEGORY_CLIENT_DETAIL":
                  sub = [r for r in rows if r.get("小類") == category and r.get("客名") == client_name]
                  stats = {
                      "order_count": len(set(r["ERP订单号"] for r in sub)),
                      "total_qty": sum(int(_safe_num(r["数量"])) for r in sub),
                      "total_amount": round(sum(_safe_num(r["訂單總金額"]) for r in sub), 2),
                  }
                  result["answer"] = json.dumps(stats, ensure_ascii=False)

              # ---------- 意图5: 客户健康度预警 ----------
              elif intent == "CUSTOMER_HEALTH":
                  if client_name:
                      target = [r for r in rows if r.get("客名") == client_name]
                  elif sales_name:
                      target = [r for r in rows if r.get("销售业务员") == sales_name]
                  else:
                      target = rows
                  by_client = {}
                  for r in target:
                      by_client.setdefault(r["客名"], []).append(r)
                  health_results = []
                  for c, grp in by_client.items():
                      if c is None:
                          continue
                      grp = sorted([g for g in grp if parse_time(g["创建时间"])], key=lambda x: x["创建时间"])
                      order_ids = set(r["ERP订单号"] for r in grp)
                      order_count = len(order_ids)
                      health = {"client": c, "risk_level": "正常", "alerts": []}
                      if order_count >= 3:
                          times = sorted(set(parse_time(r["创建时间"]) for r in grp))
                          intervals = [(times[i] - times[i-1]).days for i in range(1, len(times))]
                          avg_interval = sum(intervals) / len(intervals)
                          days_since = (now - times[-1]).days
                          if avg_interval > 0 and days_since / avg_interval > 1.5:
                              health["alerts"].append("活跃度衰减: 已{}天未下单(平均间隔{}天)".format(days_since, int(avg_interval)))
                              health["risk_level"] = "高风险"
                      recent_30 = [r for r in grp if parse_time(r["创建时间"]) >= now - timedelta(days=30)]
                      hist_90 = [r for r in grp if now - timedelta(days=90) <= parse_time(r["创建时间"]) < now - timedelta(days=30)]
                      if recent_30 and hist_90:
                          recent_aov = sum(_safe_num(r["訂單總金額"]) for r in recent_30) / len(set(r["ERP订单号"] for r in recent_30))
                          hist_aov = sum(_safe_num(r["訂單總金額"]) for r in hist_90) / len(set(r["ERP订单号"] for r in hist_90))
                          if hist_aov > 0 and recent_aov / hist_aov < 0.7:
                              health["alerts"].append("价值缩水: 近期客单价{:.0f}(历史{:.0f})".format(recent_aov, hist_aov))
                              if health["risk_level"] != "高风险":
                                  health["risk_level"] = "中风险"
                      if order_count >= 3:
                          months_active = max((parse_time(grp[-1]["创建时间"]) - parse_time(grp[0]["创建时间"])).days / 30, 1)
                          monthly_avg = order_count / months_active
                          recent_monthly = len(set(r["ERP订单号"] for r in recent_30))
                          if monthly_avg > 0 and recent_monthly / monthly_avg < 0.6:
                              health["alerts"].append("频次下降: 近30天{}单(月均{:.1f}单)".format(recent_monthly, monthly_avg))
                              if health["risk_level"] == "正常":
                                  health["risk_level"] = "中风险"
                      health_results.append(health)
                  priority = {"高风险": 0, "中风险": 1, "正常": 2}
                  health_results.sort(key=lambda x: priority.get(x["risk_level"], 3))
                  result["answer"] = json.dumps({"customer_health": health_results}, ensure_ascii=False)

              # ---------- 意图6: 按客户属性分析各产品金额/箱数及占比 ----------
              elif intent == "ATTR_PRODUCT_SALES":
                  available_attrs = sorted({r.get("客戶屬性") for r in rows if r.get("客戶屬性")})
                  if not customer_attr:
                      result["answer"] = json.dumps({
                          "error": "请指定客户属性",
                          "available_attrs": available_attrs,
                          "hint": "例如：凍肉店采购各产品的金额和箱数占比",
                      }, ensure_ascii=False)
                  else:
                      attr_rows = [r for r in rows if _match_attr(r.get("客戶屬性"), customer_attr)]
                      if not attr_rows:
                          result["answer"] = json.dumps({
                              "error": "未找到该客户属性的订单",
                              "customer_attr": customer_attr,
                              "available_attrs": available_attrs,
                          }, ensure_ascii=False)
                      else:
                          by_cat = {}
                          for r in attr_rows:
                              cat = r.get("小類") or "未知"
                              if cat not in by_cat:
                                  by_cat[cat] = {"amount": 0.0, "boxes": 0.0, "lines": 0}
                              by_cat[cat]["amount"] += _safe_num(r.get("訂單總金額"))
                              by_cat[cat]["boxes"] += _safe_num(r.get("销售数量"))
                              by_cat[cat]["lines"] += 1
                          total_amount = sum(v["amount"] for v in by_cat.values())
                          total_boxes = sum(v["boxes"] for v in by_cat.values())
                          products = []
                          for cat, v in by_cat.items():
                              products.append({
                                  "product": cat,
                                  "amount": round(v["amount"], 2),
                                  "boxes": round(v["boxes"], 2),
                                  "amount_share": round(v["amount"] / total_amount * 100, 2) if total_amount else 0.0,
                                  "boxes_share": round(v["boxes"] / total_boxes * 100, 2) if total_boxes else 0.0,
                                  "line_count": v["lines"],
                              })
                          products.sort(key=lambda x: x["amount"], reverse=True)
                          payload = {
                              "attr_product_sales": {
                                  "customer_attr": customer_attr,
                                  "total_amount": round(total_amount, 2),
                                  "total_boxes": round(total_boxes, 2),
                                  "product_count": len(products),
                                  "products": products,
                              }
                          }
                          result["answer"] = json.dumps(payload, ensure_ascii=False)

              # ---------- 意图7: 按客户属性分析下单时段偏好 ----------
              elif intent == "ATTR_ORDER_TIME":
                  available_attrs = sorted({r.get("客戶屬性") for r in rows if r.get("客戶屬性")})
                  targets = []
                  if customer_attr:
                      targets = [customer_attr]
                  else:
                      targets = available_attrs

                  analyses = []
                  for attr in targets:
                      attr_rows = [r for r in rows if _match_attr(r.get("客戶屬性"), attr)]
                      hour_counts = {h: 0 for h in range(24)}
                      valid = 0
                      for r in attr_rows:
                          t = parse_time(r.get("创建时间"))
                          if t is None:
                              continue
                          hour_counts[t.hour] += 1
                          valid += 1
                      if valid == 0:
                          analyses.append({
                              "customer_attr": attr,
                              "order_lines": 0,
                              "preferred_range": None,
                              "message": "无有效创建时间",
                          })
                          continue
                      # 找连续高峰窗口：以订单量最多的小时为中心，向两侧扩展至覆盖约60%订单
                      ranked_hours = sorted(hour_counts.items(), key=lambda x: x[1], reverse=True)
                      peak_hour = ranked_hours[0][0]
                      covered = 0
                      selected = set()
                      for h, cnt in ranked_hours:
                          selected.add(h)
                          covered += cnt
                          if covered / valid >= 0.6:
                              break
                      # 取包含峰值的最长连续区间（在selected中）
                      # 简化：以 peak 为中心，向左右扩展，只要相邻小时仍在 top selected 或订单>0且累计未超
                      left = peak_hour
                      right = peak_hour
                      while left - 1 >= 0 and (left - 1) in selected:
                          left -= 1
                      while right + 1 <= 23 and (right + 1) in selected:
                          right += 1
                      # 若 selected 不连续，至少给出峰值所在的1小时，并尽量扩展到相邻有单小时
                      while left - 1 >= 0 and hour_counts[left - 1] > 0 and (right - (left - 1) + 1) <= 4:
                          # 仅当左侧订单量接近峰值侧时扩展，避免拉太宽
                          if hour_counts[left - 1] >= hour_counts[peak_hour] * 0.25:
                              left -= 1
                          else:
                              break
                      while right + 1 <= 23 and hour_counts[right + 1] > 0 and (right + 1 - left + 1) <= 4:
                          if hour_counts[right + 1] >= hour_counts[peak_hour] * 0.25:
                              right += 1
                          else:
                              break

                      range_orders = sum(hour_counts[h] for h in range(left, right + 1))
                      hourly = [
                          {"hour": h, "orders": hour_counts[h], "share": round(hour_counts[h] / valid * 100, 2)}
                          for h in range(24) if hour_counts[h] > 0
                      ]
                      analyses.append({
                          "customer_attr": attr,
                          "order_lines": valid,
                          "peak_hour": peak_hour,
                          "preferred_range": "{:02d}:00-{:02d}:00".format(left, right + 1),
                          "preferred_start": "{:02d}:00".format(left),
                          "preferred_end": "{:02d}:00".format(right + 1),
                          "range_orders": range_orders,
                          "range_share": round(range_orders / valid * 100, 2),
                          "hourly_distribution": hourly,
                      })

                  # 单属性时突出结论；多属性时做对比
                  if customer_attr and len(analyses) == 1:
                      payload = {"attr_order_time": analyses[0]}
                  else:
                      payload = {"attr_order_time_compare": analyses}
                  result["answer"] = json.dumps(payload, ensure_ascii=False)

              else:
                  result["answer"] = "无法识别您的查询意图，请尝试输入销售名字、品类名字、客户属性（如凍肉店）或询问客户健康度。"
              return result
        code_language: python3
        outputs:
          answer:
            type: string
        title: 订单数据计算引擎
        type: code
        variables:
        - variable: parsed_intent
          value_selector:
          - intent_parser
          - text
          type: string
      position:
        x: 680
        y: 280
      type: custom
    - id: answer_formatter
      data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            temperature: 0.7
            max_tokens: 2000
          mode: chat
          name: qwen3.5-flash
          provider: qwen
        prompt_template:
        - id: sp2
          role: system
          text: |+
            你是「五丰订单数据分析助手」的最终回复生成器。系统已根据用户问题完成数据计算，你会收到：

            1. 用户原始提问（user_query）

            2. 计算引擎返回的 JSON 结果（data）


            请仅依据 data 中的真实数据，用专业、简洁、口语化且得体的中文回复用户：

            - 不要输出原始 JSON，也不要用 ``` 代码块包裹。

            - 开头用一句话直接给出用户问题的核心结论。

            - 多条数据用「- 」列表或 Markdown 表格呈现；金额单位用「元/万元」，数量用整数或合理小数；占比用「%」。

            - 有汇总/排名时，点出关键结论（最高/最低、合计多少、共几家）。

            - 若 data 含 customer_health：按风险等级（高风险>中风险>正常）组织，列出每家客户的预警原因，对高风险客户醒目提示。

            - 若 data 含 attr_product_sales：说明该客户属性下各产品（小类）的金额、箱数及各自占比，并点出金额/箱数最高的产品；金额与箱数占比可分别列表或合并表格。

            - 若 data 含 attr_order_time 或 attr_order_time_compare：明确给出更偏向的下单时段（几点到几点），并可用小时分布补充说明；多属性对比时逐一指出各自偏好时段。

            - 若 data 含 error 字段或提示"无法识别意图"：用友好语气转述，并举例可问的问题（如"琵琶腿有哪些客户买过""哪些客户有流失风险""凍肉店各产品金额箱数占比""凍肉店更偏向几点下单"）。

            - 严禁编造 data 中不存在的数字或客户。

            - 语气：专业助手，不啰嗦；结尾给一句简短的下一步建议。

        - id: up2
          role: user
          text: '用户提问：{{#sys.query#}}

            数据结果：{{#data_processor.answer#}}'
        title: 结果润色
        type: llm
        vision:
          enabled: false
      position:
        x: 980
        y: 280
      type: custom
    - id: answer
      data:
        answer: '{{#answer_formatter.text#}}'
        title: 直接回复
        type: answer
        variables: []
      position:
        x: 1280
        y: 280
      type: custom
    viewport:
      x: 0
      y: 0
      zoom: 1
